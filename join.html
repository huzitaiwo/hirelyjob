<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join Hirely — Begin with your next meaningful move</title>
    <meta
      name="description"
      content="Continue securely, then choose the workspace that fits how you are using Hirely today."
    />
    <meta name="theme-color" content="#183a2e" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/assets/icons/hirelyjob.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/join.css" />
  </head>
  <body class="page--dark">
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- HEADER (shared component, dark variant) -->
    <header class="site-header site-header--dark" id="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="/" aria-label="Hirely home">
          <span class="logo__mark" aria-hidden="true">h.</span>
          <span class="logo__word">hirely</span>
        </a>
        <nav class="site-nav" id="site-menu" aria-label="Primary">
          <ul class="site-nav__list">
            <li><a href="/jobs">Find work</a></li>
            <li><a href="/#how-it-works">How it works</a></li>
            <li><a href="/#employers">For employers</a></li>
            <li class="site-nav__mobile-only">
              <a href="/join?mode=signin">Sign in</a>
            </li>
          </ul>
        </nav>
        <div class="site-header__actions">
          <a class="site-header__signin" href="/join?mode=signin">Sign in</a>
          <a class="btn btn--lime btn--sm" href="/join" aria-current="page">
            Get started
            <svg class="icon" aria-hidden="true">
              <use href="/assets/icons/sprite.svg#i-arrow-right" />
            </svg>
          </a>
          <button
            class="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-menu"
            aria-label="Open menu"
          >
            <svg class="icon icon--menu" aria-hidden="true">
              <use href="/assets/icons/sprite.svg#i-menu" />
            </svg>
            <svg class="icon icon--close" aria-hidden="true">
              <use href="/assets/icons/sprite.svg#i-x" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="main" class="join">
      <div class="container join__inner">
        <p class="eyebrow join__eyebrow">Your Hirely account</p>
        <h1 class="join__title">Begin with your next meaningful move.</h1>
        <p class="join__lead">
          Continue securely with your Google account, then choose the workspace
          that fits how you are using Hirely today.
        </p>

        <button class="btn btn--lime btn--lg" type="button" id="auth-btn">
          <span id="auth-btn-label">Continue with Google</span>
          <svg class="icon" aria-hidden="true">
            <use href="/assets/icons/sprite.svg#i-arrow-right" />
          </svg>
        </button>

        <p class="join__error" id="auth-error" role="alert" hidden></p>
      </div>
    </main>

    <script src="/js/main.js" defer></script>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
